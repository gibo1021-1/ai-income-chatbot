name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_CONSULTATION_URL: ${{ vars.NEXT_PUBLIC_CONSULTATION_URL }}
          NEXT_PUBLIC_PAYMENT_STEP1_URL: ${{ vars.NEXT_PUBLIC_PAYMENT_STEP1_URL }}
          NEXT_PUBLIC_PAYMENT_STEP2_URL: ${{ vars.NEXT_PUBLIC_PAYMENT_STEP2_URL }}
          NEXT_PUBLIC_PAYMENT_STEP3_URL: ${{ vars.NEXT_PUBLIC_PAYMENT_STEP3_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
